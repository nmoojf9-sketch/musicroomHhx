<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Room</title><link rel="stylesheet" href="style.css"></head><body>
<main><section id="home" class="screen active"><div class="hero"><div class="logo">♫</div><h1>Music Room</h1><p>با دوستانت همزمان گوش بده و صفحه‌ات را به اشتراک بگذار.</p></div><div class="card home"><button id="create" class="primary">ساخت اتاق</button><div class="or">یا</div><div class="join"><input id="code" placeholder="کد اتاق"><button id="join" class="secondary">ورود</button></div><p class="hint">سرگروه می‌تواند صدا، تصویر یا هر دو را برای اعضای اتاق ارسال کند.</p></div></section>
<section id="room" class="screen"><header><b>🟢 <span id="title"></span></b><button id="copy" class="secondary">کپی لینک</button></header><div class="layout"><section class="card stage"><div id="empty" class="empty">🎧<h2>اتاق آماده است</h2><p>یکی از گزینه‌های اشتراک‌گذاری را انتخاب کن.</p></div><video id="video" autoplay playsinline controls></video><audio id="audio" autoplay controls></audio><div class="buttons"><button id="audioBtn">🎵 فقط صدا</button><button id="screenBtn">🖥️ فقط تصویر</button><button id="bothBtn" class="hot">🎵🖥️ صدا + تصویر</button><button id="stop">⏹ توقف</button></div></section><aside><div class="card"><h3>اعضای اتاق (<span id="count">1</span>)</h3><div id="members"></div></div><div class="card code"><small>کد اتاق</small><strong id="roomCode"></strong></div><button id="leave" class="leave">خروج</button></aside></div></section></main><div id="toast"></div><script src="app.js"></script></body></html>
